<a rel="nofollow" href="javascript:void(0)" (click)="skipToMain()" class="p-2 bg-white fixed top-0 -translate-y-full focus:translate-y-0">Skip to main</a>

<div class="flex w-screen h-screen">
	<nav class="p-4 md:p-6 w-min h-full text-white bg-gray-750 font-mmd">
		<div class="cursor-default text-center">
			<h1 title="Bug's Plugins" aria-label="Bug's Plugins" class="text-4xl md:text-5xl font-bold md:text-left">
				<span class="max-md:hidden">Bug's Plugins</span>
				<span class="md:hidden">BP</span>
			</h1>
			<p class="mt-2 font-mono text-xs hidden md:block">( They're called 'Bugins' )</p>
		</div>
		<ul class="flex flex-col gap-2 mt-6 md:mt-12 text-3xl whitespace-nowrap">
			<li>
				<a title="About" aria-label="About" routerLink="/">
					<span class="max-md:hidden with-arrow">About</span>
					<span class="md:hidden"> A </span>
				</a>
			</li>
			<li>
				<a title="Blockbench" aria-label="Blockbench" routerLink="/blockbench">
					<span class="max-md:hidden with-arrow">Blockbench</span>
					<span class="md:hidden"> BB </span>
				</a>
			</li>
			<li>
				<a title="Minecraft" aria-label="Minecraft" routerLink="/minecraft">
					<span class="max-md:hidden with-arrow">Minecraft</span>
					<span class="md:hidden"> MC </span>
				</a>
			</li>
			<li>
				<a title="Dalek Mod" aria-label="Dalek Mod" routerLink="/dalek-mod">
					<span class="max-md:hidden with-arrow">Dalek mod</span>
					<span class="md:hidden"> DM </span>
				</a>
			</li>
			<li class="mt-6">
				<a title="Donate GitHub Sponsors" aria-label="Donate GitHub Sponsors" [href]="github">
					<svg class="icon">
						<use href="assets/icons/github-sponsors.svg#icon"></use>
					</svg>
					<span class="max-md:hidden">Donate</span>
				</a>
			</li>
		</ul>
	</nav>

	<main id="main" class="overflow-y-auto outline-none grow w-full h-screen bg-gray-700 bg-hero-circuit-board-gray-500">
		<router-outlet></router-outlet>
	</main>
</div>
