<div class="grid grid-cols-3 gap-4 p-4 md:flex w-full bg-gray-500 rounded-3xl">
	<div aria-hidden class="overflow-hidden shrink-0 w-full bg-gray-400 bg-opacity-50 rounded-lg select-none aspect-square md:w-28 md:h-28 md:rounded-3xl">
		@switch(plugin().imageType) {
			@case('url') { <img [src]="plugin().image" alt="" [class.pixelated]="plugin().sharp" class="w-full h-full" /> }
			@case('fontawesome') { <i [class]="plugin().image" class="w-full h-full text-[2.75rem] sm:text-[7rem] scale-75 text-center text-white fa"></i> }
			@case('google') { <i class="w-full h-full text-[2.75rem]! sm:text-[7rem]! text-center text-white scale-95 material-icons">{{ plugin().image }}</i> }
		}
	</div>
	<div class="contents text-white md:block">
		<p class="col-span-2 text-lg font-bold sm:text-2xl">{{ plugin().title }}</p>
		<p class="col-span-full">{{ plugin().description }}</p>
	</div>
	<div class="grid col-span-full gap-y-2 grid-rows-2 md:ml-auto md:h-28 md:gap-y-4">
		<a [href]="plugin().downloadURL" [download]="plugin().fileName" class="btn"> Download </a>
		@if (plugin().moreInfo) { <a [href]="plugin().moreInfo" class="btn"> More Info </a> }
	</div>
</div>
